<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список заказов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div class="container mt-4">
    <h1>Список заказов</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Столик</th>
            <th>Создан</th>
            <th>Роль</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <!-- Thymeleaf цикл для отображения заказов -->
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.table.position}"></td>
            <td th:text="${order.user.username}"></td>
            <td th:text="${order.user.role}"></td>
            <td th:text="${order.orderStatus}"></td>
            <td><button>Удалить</button></td>
        </tr>
        </tbody>
    </table>
    <button class="open-button" onclick="openForm()">Создать заказ</button>
</div>

<script>
    function openForm() {
        document.getElementById("myForm").style.display = "block"; }
         function closeForm() {
document.getElementById("myForm").style.display = "none";
} </script>

<div class="form-popup" id="myForm">
    <form action="#" class="form-container">
        <h1>Заказ</h1>
        <label for="name"><b>Столик</b></label>
        <select id="name">
            <option>Столик 1</option>
            <option>Столик 2</option>
            <option>Столик 3</option>
            <option>Столик 4</option>
        </select>
        <label for="email"><b>Е-мейл</b></label>
        <input type="text" placeholder="Ваш е-мейл" id="email" required>
        <button type="submit" class="btn">Отправить</button>
        <button type="button" class="btn cancel" onclick="closeForm()">Закрыть</button>
    </form>
</div>


</body>
</html>
