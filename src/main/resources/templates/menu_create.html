<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать новую позицию</title>
    <link th:href="@{/css/order_form.css}" rel="stylesheet">
</head>
<body>
<div class="form-container">
    <h1>Добавить новую позицию</h1>
    <form th:action="@{/menu/create}" method="post" class="menu-form">
        <div class="form-group">
            <label for="name">Название</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="desc">Описание</label>
            <input type="text" id="desc" name="description">
        </div>

        <div class="form-group">
            <label for="price">Цена</label>
            <input type="number" id="price" name="price" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label for="category">Категория</label>
            <input type="text" id="category" name="category">
        </div>

        <div class="form-group">
            <label for="isAvailable">Доступность</label>
            <select id="isAvailable" name="isAvailable" required>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </div>

        <input type="hidden" name="isDeleted" value="false">

        <div class="form-actions">
            <button type="submit" class="btn-submit">Создать позицию</button>
        </div>
    </form>
</div>
</body>
</html>
