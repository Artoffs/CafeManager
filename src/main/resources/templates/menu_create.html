<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать новую позицию</title>
    <link th:href="@{/css/order_form.css}" rel="stylesheet">
</head>
<body>
<form th:action="@{/menu/create}" method="post">
    <div class="item-row">
        <label for="name">Название</label>
        <input type="text" id="name" name="name">

        <label for="desc">Описание</label>
        <input type="text" id="desc" name="description">

        <label for="price">Цена</label>
        <input type="number" id="price" name="price" min="1" value="1">

        <label for="category">Категория</label>
        <input type="number" id="category" name="category">
    </div>
    <button type="submit">Создать заказ</button>
</form>
</body>
</html>
