user.get = SELECT id, username, password FROM public."user" WHERE id=?;
user.getAll = SELECT id, username, password, createdAt FROM public."user";
user.insert = INSERT INTO public.\"user\"(\n\tid, username, password, \"createdAt\")\n\tVALUES (?, ?, ?, ?);
user.update = UPDATE public.\"user\"SET id=?, username=?, password=?, \"createdAt\"=? WHERE id=?;
user.delete = DELETE FROM public.\"user\" WHERE id=?;